transport select jtag
if { [info exists JTAGFREQ] } {
    adapter speed $JTAGFREQ
} else {
    adapter speed 5000
}

if { [info exists SYSNAME] } {
    set _SYSNAME $SYSNAME
} else {
    set _SYSNAME grace-c2
}

jtag newtap grace.1 armjtag -irlen 4 -expected-id 0x6ba00477
jtag newtap grace.0 armjtag -irlen 4 -expected-id 0x6ba00477

set _CURRENT_SOCKET 0
set _CHIPNAME grace.$_CURRENT_SOCKET
set _CPUTAPID 0x6ba00477

dap create $_CHIPNAME.armjtag.dap -chain-position $_CHIPNAME.armjtag -adiv5 -ignore-syspwrupack
target create $_CHIPNAME.apb mem_ap -dap $_CHIPNAME.armjtag.dap -ap-num 0
init
if { [catch {$_CHIPNAME.apb arp_examine} err] } {
    puts "APB examine failed: $err"
    shutdown error
} else {
    puts "APB examine succeeded"
}
shutdown
