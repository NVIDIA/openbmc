KERNEL_DEVICETREE = "axiado/axiado-gb300nvl-bmc-mt2.dtb"
KERNEL_DEVICETREE += "axiado/axiado-gb300nvl-bmc-mts2.dtb"

SOC_REVISION = "revA"

# Conditional assignments for different board revisions
UBOOT_MACHINE_revA = "ax3000_evk_defconfig"
UBOOT_MACHINE_revB = "ax3000b0_evk_defconfig"

# Dynamically set KBUILD_DEFCONFIG based on SOC_REVISION
UBOOT_MACHINE = "${UBOOT_MACHINE_${SOC_REVISION}}"

# Fallback to default if SOC_REVISION is not set or doesn't match
UBOOT_MACHINE ??= "ax3000_evk_defconfig"

# Forces OTP provisioning image to use the prod configuration
#OTP_KEY_TYPE ?= "prod"

# Manipulate the DISTRO_NAME variable string for our needs
DISTRO_NAME = "NVIDIA Host BMC (OpenBMC Project Reference Distro)"

require conf/machine/include/axiado.inc
require conf/distro/include/pldm.inc

WKS_FILE = "emmc-gb300nvl-bmc-axiado.wks.in"

FLASH_SIZE = "65535"
SERIAL_CONSOLES = "115200;ttyPS3"
OBMC_ORG_YAML_SUBDIRS:append:ax3000 = " com/axiado"

OBMC_COMPATIBLE_NAMES = "ax3000"
EXTENDED_VERSION = "${DISTRO_VERSION}"

VIRTUAL-RUNTIME_obmc-inventory-manager = "entity-manager"
#VIRTUAL-RUNTIME_obmc-inventory-manager = "nvidia-gpumgr"
PREFERRED_PROVIDER_virtual/obmc-inventory-data = "entity-manager"
#PREFERRED_PROVIDER_virtual/obmc-inventory-data = "nvidia-gpumgr"
PREFERRED_PROVIDER_virtual/phosphor-led-manager-config-native = "led-manager-config-native"

# Install Kernel modules
MACHINE_EXTRA_RRECOMMENDS = "kernel-modules"

# Remove default OpenBMC features we don't need
DISTRO_FEATURES:remove = "avahi"
IMAGE_FEATURES:remove = "obmc-phosphor-power"
IMAGE_FEATURES:remove = "phosphor-snmp"

# this is needed by emmc, avoid removing it.
BAD_RECOMMENDATIONS:remove = "e2fsprogs-e2fsck"

# Build type, valid values are debug, dev and prod (production)
# Affects how signing is done and what keys are used and is included
# in the names of resulting images
#  BUILD_TYPE="prod" : The firmware is signed with production keys and no development tools enabled.
#  BUILD_TYPE="debug": The firmware is signed with debug keys and no development tools enabled.
#  BUILD_TYPE="dev": The firmware includes debug tools enabled for the development and signed with debug keys.
BUILD_TYPE ?= "dev"

DISTRO_FEATURES += "${@bb.utils.contains('BUILD_TYPE', 'prod', ' nvidia-admin-account ', '', d)}"
DISTRO_FEATURES += "erotless-bmc"
BMC_UUID ?= "678aac1134244bcc8a750bb622a3cfeb"
